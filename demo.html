<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>历史人物关系图谱 · walk</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vis-network@9.1.9/styles/vis-network.min.css">
<style>
  :root {
    --ink: #070b10; --ink-2: #0b121a; --panel: #0c141d; --line: #1d2c39;
    --text: #e9eef3; --muted: #8b9bab; --gold: #d9b45b; --gold-soft: #f4d58d;
    --jade: #4fd1a5; --seal: #a33a32;
    --serif: "Noto Serif SC", "Songti SC", "STSong", "SimSun", Georgia, serif;
    --sans: "Noto Sans SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; color: var(--text); font-family: var(--sans); background:
      radial-gradient(1100px 620px at 18% -12%, rgba(217, 180, 91, .10), transparent 60%),
      radial-gradient(900px 600px at 100% 0%, rgba(79, 209, 165, .07), transparent 55%),
      var(--ink);
    overflow: hidden;
  }
  header {
    display: flex; align-items: center; gap: 16px; padding: 12px 22px;
    border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, rgba(10, 16, 23, .95), rgba(7, 11, 16, .82));
    position: relative; z-index: 6;
  }
  .brand { display: flex; align-items: center; gap: 12px; flex: none; }
  .seal {
    width: 42px; height: 42px; border-radius: 9px; display: grid; place-items: center;
    color: #f8e9c0; background: linear-gradient(145deg, #b9473d, #7f2823);
    border: 1px solid rgba(244, 213, 141, .45);
    box-shadow: 0 6px 18px rgba(163, 58, 50, .35), inset 0 0 0 1px rgba(255, 255, 255, .10);
    font: 700 21px/1 var(--serif);
  }
  .brand h1 { margin: 0; font: 600 20px/1.2 var(--serif); letter-spacing: 2px; }
  .brand p { margin: 3px 0 0; color: var(--muted); font-size: 10.5px; letter-spacing: 1.4px; text-transform: uppercase; }
  .search-wrap { position: relative; flex: 1; max-width: 470px; margin-left: 18px; }
  .search-wrap input {
    width: 100%; padding: 10px 38px 10px 14px; color: var(--text);
    background: rgba(8, 15, 23, .92); border: 1px solid var(--line); border-radius: 10px;
    outline: none; font: 13px var(--sans);
  }
  .search-wrap input:focus { border-color: rgba(217, 180, 91, .65); box-shadow: 0 0 0 3px rgba(217, 180, 91, .10); }
  .search-icon { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 14px; pointer-events: none; }
  #searchResults {
    position: absolute; left: 0; right: 0; top: calc(100% + 6px); z-index: 30;
    display: none; background: #0d1822; border: 1px solid var(--line); border-radius: 10px;
    box-shadow: 0 18px 50px rgba(0, 0, 0, .55); overflow: hidden;
  }
  #searchResults.show { display: block; }
  .search-item { display: flex; align-items: baseline; gap: 8px; width: 100%; padding: 9px 12px; border: 0; border-bottom: 1px solid rgba(29, 44, 57, .7); background: transparent; color: var(--text); text-align: left; cursor: pointer; }
  .search-item:last-child { border-bottom: 0; }
  .search-item:hover { background: rgba(217, 180, 91, .08); }
  .search-item b { font-family: var(--serif); font-size: 14px; color: var(--gold-soft); font-weight: 600; }
  .search-item span { color: var(--muted); font-size: 11.5px; }
  .header-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; flex: none; }
  button {
    font: 12.5px var(--sans); color: var(--text); background: #111d27;
    border: 1px solid var(--line); border-radius: 9px; padding: 8px 12px; cursor: pointer;
    white-space: nowrap; transition: .15s ease;
  }
  button:hover { border-color: rgba(217, 180, 91, .55); background: #162633; }
  button.gold { color: #1c1508; background: linear-gradient(135deg, #e8c872, #c89a3f); border-color: rgba(244, 213, 141, .55); font-weight: 700; }
  button.gold:hover { background: linear-gradient(135deg, #f0d589, #d6a84c); }
  button.ghost { background: transparent; }
  button.tiny { padding: 5px 9px; font-size: 11.5px; }
  .status { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 11.5px; white-space: nowrap; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #f0b429; box-shadow: 0 0 8px #f0b429; }
  .dot.ok { background: var(--jade); box-shadow: 0 0 8px var(--jade); }
  .dot.bad { background: #f87171; box-shadow: 0 0 8px #f87171; }
  .filterbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 9px 22px; border-bottom: 1px solid var(--line); background: rgba(8, 13, 19, .72); position: relative; z-index: 5; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { padding: 5px 11px; border-radius: 999px; border: 1px solid var(--line); background: rgba(13, 24, 34, .7); color: var(--muted); cursor: pointer; font-size: 12px; }
  .chip:hover { color: var(--text); border-color: rgba(217, 180, 91, .4); }
  .chip.active { color: #1c1508; background: linear-gradient(135deg, #e8c872, #c89a3f); border-color: transparent; font-weight: 700; }
  select { color: var(--text); background: #0d1822; border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; font: 12px var(--sans); outline: none; }
  .filter-spacer { flex: 1; }
  .counter { color: var(--muted); font-size: 11.5px; }
  .counter b { color: var(--gold-soft); font-weight: 600; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 360px; height: calc(100vh - 108px); }
  .graph { position: relative; min-width: 0; overflow: hidden; background: radial-gradient(800px 500px at 50% 40%, rgba(27, 50, 62, .30), transparent 70%); }
  #network { position: absolute; inset: 0; }
  .graph-toolbar { position: absolute; left: 16px; right: 16px; top: 14px; z-index: 3; display: flex; align-items: center; gap: 8px; pointer-events: none; }
  .graph-toolbar > * { pointer-events: auto; }
  .graph-toolbar .spacer { flex: 1; }
  .legend { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 6px 9px; background: rgba(7, 12, 18, .72); border: 1px solid rgba(29, 44, 57, .8); border-radius: 8px; color: var(--muted); font-size: 10.5px; backdrop-filter: blur(6px); }
  .legend i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; margin-right: 4px; }
  div.vis-tooltip {
    padding: 0 !important; background: transparent !important; border: 0 !important;
    box-shadow: none !important; white-space: normal !important; max-width: 340px;
    pointer-events: none; z-index: 20;
  }
  .walk-tip {
    max-width: 330px; padding: 10px 12px; color: var(--text);
    background: linear-gradient(180deg, #0e1c28, #0a141d);
    border: 1px solid rgba(217, 180, 91, .38); border-radius: 10px;
    box-shadow: 0 16px 40px rgba(0, 0, 0, .55);
    font: 12px/1.65 var(--sans); white-space: normal;
  }
  .walk-tip .tip-head { display: flex; align-items: baseline; gap: 7px; flex-wrap: wrap; margin-bottom: 5px; }
  .walk-tip .tip-head b { font: 600 16px/1.2 var(--serif); color: var(--gold-soft); }
  .walk-tip .tip-head span { color: var(--muted); font-size: 10.5px; }
  .walk-tip .tip-meta { color: #9fb3c7; font-size: 11px; margin-bottom: 3px; }
  .walk-tip .tip-title { color: var(--jade); font-size: 11px; margin-bottom: 5px; }
  .walk-tip .tip-bio { color: #c6d3dd; border-top: 1px solid rgba(217, 180, 91, .16); padding-top: 6px; }
  .walk-tip .tip-type { display: inline-block; padding: 1px 6px; border: 1px solid rgba(217, 180, 91, .35); border-radius: 4px; color: var(--gold-soft); font-size: 10px; }
  .path-banner { position: absolute; left: 50%; top: 58px; transform: translateX(-50%); z-index: 4; display: none; align-items: center; gap: 10px; padding: 8px 12px; background: rgba(10, 18, 26, .94); border: 1px solid rgba(217, 180, 91, .45); border-radius: 999px; box-shadow: 0 12px 32px rgba(0, 0, 0, .4); font-size: 12px; color: var(--gold-soft); max-width: min(760px, calc(100% - 32px)); }
  .path-banner.show { display: flex; }
  .path-banner .chain { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .path-banner button { padding: 4px 8px; font-size: 11px; }
  .empty-state { position: absolute; inset: 0; z-index: 5; display: grid; place-items: center; background: radial-gradient(600px 400px at 50% 45%, rgba(12, 22, 31, .96), rgba(7, 11, 16, .98)); padding: 28px; }
  .empty-card { max-width: 440px; text-align: center; padding: 30px; border: 1px solid rgba(217, 180, 91, .22); border-radius: 18px; background: rgba(10, 17, 24, .8); box-shadow: 0 30px 80px rgba(0, 0, 0, .45); }
  .empty-card h2 { margin: 0 0 8px; font: 600 25px/1.25 var(--serif); letter-spacing: 3px; color: var(--gold-soft); }
  .empty-card p { margin: 0 0 20px; color: var(--muted); font-size: 13px; line-height: 1.8; }
  .empty-card .hint { margin-top: 14px; color: #6f8090; font-size: 11px; }
  .empty-card code { color: var(--jade); }
  aside { border-left: 1px solid var(--line); background: linear-gradient(180deg, rgba(11, 19, 27, .96), rgba(7, 12, 18, .98)); overflow: auto; }
  .detail { padding: 20px 20px 28px; min-height: 100%; }
  .detail-empty { padding: 30px 8px; color: var(--muted); text-align: center; line-height: 1.9; font-size: 12.5px; }
  .detail-empty .big { font: 600 20px var(--serif); color: var(--gold-soft); letter-spacing: 2px; margin-bottom: 8px; }
  .person-head { display: flex; align-items: flex-start; gap: 12px; }
  .avatar { width: 52px; height: 52px; flex: none; border-radius: 13px; display: grid; place-items: center; font: 600 23px/1 var(--serif); color: #1a1306; background: linear-gradient(145deg, var(--gold-soft), #c89a3f); box-shadow: 0 8px 20px rgba(0, 0, 0, .3); }
  .person-head h2 { margin: 0; font: 600 25px/1.15 var(--serif); letter-spacing: 2px; }
  .person-sub { margin: 4px 0 0; color: var(--muted); font-size: 11.5px; }
  .badge { display: inline-block; padding: 2px 7px; border-radius: 5px; border: 1px solid currentColor; font-size: 10px; letter-spacing: .5px; vertical-align: middle; margin-left: 6px; }
  .person-meta { display: flex; gap: 14px; flex-wrap: wrap; margin: 16px 0 12px; padding: 10px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); color: var(--muted); font-size: 11.5px; }
  .person-meta b { color: var(--text); font-weight: 500; }
  .bio { color: #c6d3dd; font-size: 12.5px; line-height: 1.8; margin: 0 0 16px; }
  .actions { display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 20px; }
  .section-label { color: var(--gold); font-size: 10px; letter-spacing: 1.6px; text-transform: uppercase; margin: 18px 0 9px; font-weight: 700; }
  .relations { display: flex; flex-direction: column; gap: 7px; }
  .relation { display: flex; align-items: flex-start; gap: 9px; width: 100%; padding: 9px 10px; background: rgba(13, 24, 34, .72); border: 1px solid var(--line); border-radius: 10px; color: var(--text); text-align: left; cursor: pointer; transition: .15s; }
  .relation:hover { border-color: rgba(217, 180, 91, .5); background: rgba(22, 38, 50, .8); }
  .rel-icon { width: 22px; height: 22px; flex: none; border-radius: 6px; display: grid; place-items: center; font-size: 11px; color: #08110d; font-weight: 800; }
  .rel-body { min-width: 0; }
  .rel-line { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
  .rel-line b { font: 600 14px var(--serif); color: var(--gold-soft); }
  .rel-type { font-size: 10px; color: var(--muted); border: 1px solid var(--line); padding: 1px 5px; border-radius: 4px; }
  .rel-note { color: #8fa0ae; font-size: 11px; line-height: 1.5; margin-top: 3px; }
  .graph-footer { position: absolute; left: 16px; bottom: 14px; z-index: 3; display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 10.5px; background: rgba(7, 12, 18, .72); border: 1px solid rgba(29, 44, 57, .8); border-radius: 8px; padding: 6px 9px; }
  .graph-footer b { color: var(--gold-soft); font-weight: 600; }
  .graph-footer .spacer { flex: 1; }
  #toast { position: fixed; right: 18px; bottom: 18px; z-index: 50; max-width: 390px; padding: 10px 13px; border-radius: 10px; color: var(--text); background: #0d1822; border: 1px solid rgba(79, 209, 165, .4); box-shadow: 0 18px 40px rgba(0, 0, 0, .45); opacity: 0; transform: translateY(8px); transition: .18s; pointer-events: none; }
  #toast.show { opacity: 1; transform: translateY(0); }
  #toast.error { border-color: rgba(248, 113, 113, .55); }
  .loading { position: absolute; inset: 0; z-index: 8; display: grid; place-items: center; background: rgba(7, 11, 16, .72); color: var(--muted); font-size: 12px; letter-spacing: 1px; }
  .loading.hidden { display: none; }
  @media (max-width: 1050px) {
    main { grid-template-columns: 1fr; grid-template-rows: minmax(58vh, 1fr) auto; height: auto; }
    aside { border-left: 0; border-top: 1px solid var(--line); max-height: 46vh; }
    body { overflow: auto; }
    .search-wrap { order: 5; max-width: none; margin-left: 0; flex-basis: 100%; }
    header { flex-wrap: wrap; }
  }
  @media (max-width: 640px) {
    .brand h1 { font-size: 17px; }
    .header-actions .hide-sm { display: none; }
    .filterbar { padding: 8px 14px; }
    header { padding: 10px 14px; }
    .graph-toolbar { left: 10px; right: 10px; top: 10px; }
    .legend { display: none; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="seal">史</div>
    <div><h1>历史人物关系图谱</h1><p>Chinese Historical Figures · walk graph</p></div>
  </div>
  <div class="search-wrap">
    <input id="search" type="text" placeholder="搜索人物、字号、朝代、事迹…" autocomplete="off" spellcheck="false" aria-label="搜索历史人物">
    <span class="search-icon">⌕</span>
    <div id="searchResults"></div>
  </div>
  <div class="header-actions">
    <span class="status"><i id="connDot" class="dot"></i><span id="connText">连接中</span></span>
    <button id="randomBtn" class="ghost hide-sm">随机人物</button>
    <button id="fitBtn" class="ghost">重置视图</button>
    <button id="reloadBtn" class="ghost hide-sm">刷新</button>
  </div>
</header>

<div class="filterbar">
  <div class="chips" id="dynastyChips"></div>
  <div class="filter-spacer"></div>
  <select id="relFilter" aria-label="关系类型"><option value="全部">全部关系</option></select>
  <span class="counter" id="counter"></span>
</div>

<main>
  <section class="graph">
    <div id="network"></div>
    <div class="graph-toolbar"><div class="legend" id="legend"></div><span class="spacer"></span></div>
    <div class="path-banner" id="pathBanner"></div>
    <div class="graph-footer"><span>可见 <b id="visiblePeople">0</b> 人物 · <b id="visibleLinks">0</b> 关系</span><span class="spacer"></span><span>点击人物查看详情 · 双击聚焦</span></div>
    <div class="empty-state" id="emptyState">
      <div class="empty-card">
        <h2>一图看尽千年人物</h2>
        <p>从春秋诸子到南宋忠臣，沿着师承、君臣、盟友与思想传承，探索中国历史人物之间的关系网络。</p>
        <button id="seedBtn" class="gold">载入示例人物图谱</button>
        <div class="hint" id="emptyHint">需要先启动 <code>walk serve --addr=:7474</code></div>
      </div>
    </div>
    <div class="loading hidden" id="loading">正在读取图谱…</div>
  </section>
  <aside><div class="detail" id="detail"><div class="detail-empty"><div class="big">人物 · 关系</div>点击左侧人物，查看朝代、生平与关系。<br>可用上方朝代筛选、搜索或“随机人物”开始探索。</div></div></aside>
</main>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const API = new URLSearchParams(location.search).get('api') || 'http://127.0.0.1:7474';
  const DYNASTY_ORDER = ['春秋', '战国', '秦', '西汉', '三国', '唐', '宋'];
  const DYNASTY_COLORS = { '春秋': '#d9b45b', '战国': '#e08a3c', '秦': '#d95c5c', '西汉': '#5b8ee8', '三国': '#9b7bf0', '唐': '#e56aa6', '宋': '#46c39a' };
  const REL_LABELS = { INFLUENCED: '思想传承', TEACHER: '师承', RULER: '君臣', ALLY: '盟友', ENEMY: '敌对', FAMILY: '亲族', FRIEND: '友人', LEARNED: '问学', SERVED: '效力', RIVAL: '政见相左' };
  const REL_COLORS = { INFLUENCED: '#a3e635', TEACHER: '#f0b429', RULER: '#60a5fa', ALLY: '#34d399', ENEMY: '#fb7185', FAMILY: '#c084fc', FRIEND: '#22d3ee', LEARNED: '#fbbf24', SERVED: '#94a3b8', RIVAL: '#f472b6' };

  const SEED = `CREATE
    (p1:Person {name: "孔子", zi: "仲尼", dynasty: "春秋", born: -551, died: -479, title: "至圣先师", bio: "儒家学派创始人，主张仁与礼，周游列国，整理六经。"}),
    (p2:Person {name: "老子", zi: "聃", dynasty: "春秋", born: -571, died: -471, title: "道家始祖", bio: "著《道德经》，主张道法自然、无为而治。"}),
    (p3:Person {name: "孟子", zi: "轲", dynasty: "战国", born: -372, died: -289, title: "亚圣", bio: "发展仁政与性善论，提出民贵君轻。"}),
    (p4:Person {name: "荀子", zi: "况", dynasty: "战国", born: -313, died: -238, title: "儒家宗师", bio: "主张性恶论与礼法并用，弟子韩非、李斯。"}),
    (p5:Person {name: "庄子", zi: "周", dynasty: "战国", born: -369, died: -286, title: "南华真人", bio: "以寓言阐发逍遥与齐物，继承老子之道。"}),
    (p6:Person {name: "韩非", zi: "非", dynasty: "战国", born: -280, died: -233, title: "法家集大成者", bio: "综合法术势，著《韩非子》，影响秦制。"}),
    (p7:Person {name: "李斯", zi: "通古", dynasty: "秦", born: -284, died: -208, title: "秦朝丞相", bio: "辅佐秦始皇统一文字与度量衡，后为赵高所害。"}),
    (p8:Person {name: "秦始皇", zi: "政", dynasty: "秦", born: -259, died: -210, title: "始皇帝", bio: "统一六国，建立中央集权与郡县制。"}),
    (p9:Person {name: "项羽", zi: "羽", dynasty: "秦", born: -232, died: -202, title: "西楚霸王", bio: "巨鹿破秦，勇冠三军，楚汉相争败于垓下。"}),
    (p10:Person {name: "刘邦", zi: "邦", dynasty: "西汉", born: -256, died: -195, title: "汉高祖", bio: "建立汉朝，约法三章，休养生息。"}),
    (p11:Person {name: "张良", zi: "子房", dynasty: "西汉", born: -250, died: -186, title: "留侯", bio: "运筹帷幄之中，决胜千里之外，汉初三杰。"}),
    (p12:Person {name: "韩信", zi: "信", dynasty: "西汉", born: -231, died: -196, title: "淮阴侯", bio: "汉初名将，连百万之军，战必胜，攻必取。"}),
    (p13:Person {name: "司马迁", zi: "子长", dynasty: "西汉", born: -145, died: -86, title: "太史公", bio: "忍辱负重，著《史记》，究天人之际。"}),
    (p14:Person {name: "汉武帝", zi: "彻", dynasty: "西汉", born: -156, died: -87, title: "汉武大帝", bio: "罢黜百家，独尊儒术，开疆拓土。"}),
    (p15:Person {name: "卫青", zi: "仲卿", dynasty: "西汉", born: -155, died: -106, title: "大将军", bio: "七战匈奴，收复河朔，沉稳谦逊。"}),
    (p16:Person {name: "霍去病", zi: "去病", dynasty: "西汉", born: -140, died: -117, title: "冠军侯", bio: "封狼居胥，匈奴未灭，何以家为。"}),
    (p17:Person {name: "王昭君", zi: "嫱", dynasty: "西汉", born: -54, died: 19, title: "明妃", bio: "出塞和亲，换得汉匈数十年和平。"}),
    (p18:Person {name: "刘备", zi: "玄德", dynasty: "三国", born: 161, died: 223, title: "昭烈帝", bio: "三顾茅庐，建立蜀汉，以仁德著称。"}),

  const state = { people: new Map(), links: [], selected: null, query: '', dynasty: '全部', relType: '全部', pathStart: null, pathNodes: new Set(), pathEdges: new Set(), pathInfo: null, nodesDS: null, edgesDS: null, network: null, loaded: false, firstFit: false };

  async function api(path, method = 'GET', body = null) {
    const opt = { method, mode: 'cors', headers: {} };
    if (body !== null) { opt.headers['Content-Type'] = 'text/plain;charset=UTF-8'; opt.body = body; }
    let res;
    try { res = await fetch(API + path, opt); }
    catch (e) { throw new Error(`无法连接 ${API}。请先运行 walk serve --addr=:7474。`); }
    const text = await res.text();
    let data; try { data = text ? JSON.parse(text) : null; } catch { data = { error: text }; }
    if (!res.ok) throw new Error((data && data.error) || `HTTP ${res.status}`);
    return data;
  }
  function showToast(msg, error = false) {
    const el = $('toast'); el.textContent = msg; el.classList.toggle('error', error); el.classList.add('show');
    clearTimeout(showToast.timer); showToast.timer = setTimeout(() => el.classList.remove('show'), 3600);
  }
  function setConn(ok, text) { $('connDot').className = 'dot ' + (ok ? 'ok' : 'bad'); $('connText').textContent = text; }

  function year(v) { if (v === null || v === undefined) return '?'; return v < 0 ? `前${-v}` : `${v}`; }
  function dynastyColor(d) { return DYNASTY_COLORS[d] || '#8b9bab'; }
  function relLabel(t) { return REL_LABELS[t] || t; }
  function relColor(t) { return REL_COLORS[t] || '#64809a'; }
  function tipElement(html) {
    const el = document.createElement('div');
    el.className = 'walk-tip';
    el.innerHTML = html;
    return el;
  }
  function nodeTooltip(props, dynasty) {
    return tipElement(
      `<div class="tip-head"><b>${esc(props.name || '')}</b>${props.zi ? `<span>字 ${esc(props.zi)}</span>` : ''}</div>` +
      `<div class="tip-meta">${esc(dynasty || '')} · ${year(props.born)}—${year(props.died)}</div>` +
      (props.title ? `<div class="tip-title">${esc(props.title)}</div>` : '') +
      (props.bio ? `<div class="tip-bio">${esc(props.bio)}</div>` : '')

  function edgeTooltip(link) {
    return tipElement(
      `<div class="tip-head"><b>${esc(relLabel(link.type))}</b><span class="tip-type">${esc(link.type)}</span></div>` +
      (link.props.note ? `<div class="tip-bio">${esc(link.props.note)}</div>` : '')
    );
  }

  function initNetwork() {
    state.network = new vis.Network($('network'), { nodes: state.nodesDS, edges: state.edgesDS }, {
      autoResize: true,
      physics: { enabled: true, stabilization: { enabled: true, iterations: 260, updateInterval: 25 }, barnesHut: { gravitationalConstant: -11000, springLength: 170, springConstant: 0.035, damping: 0.14 } },
      interaction: { hover: true, tooltipDelay: 120, multiselect: false, navigationButtons: false },
      nodes: { chosen: true, shadow: { enabled: true, color: 'rgba(0,0,0,.45)', size: 12, x: 0, y: 3 } },
      edges: { chosen: true, selectionWidth: 2 },
      layout: { improvedLayout: true },
    });
    state.network.on('click', (params) => {
      if (params.nodes.length) onPersonClick(String(params.nodes[0]));
      else if (!params.edges.length) clearSelection();
    });
    state.network.on('doubleClick', (params) => { if (params.nodes.length) state.network.focus(params.nodes[0], { scale: 1.35, animation: true }); });
    state.network.on('stabilizationIterationsDone', () => { if (!state.firstFit) { state.network.fit({ animation: { duration: 600 } }); state.firstFit = true; } });
  }

  async function load() {
    $('loading').classList.remove('hidden');
    try {
      const [nodesRes, edgesRes] = await Promise.all([
        api('/query', 'POST', 'MATCH (n:Person) RETURN n'),
        api('/query', 'POST', 'MATCH (a:Person)-[r]->(b:Person) RETURN r'),
      ]);
      state.people.clear(); state.links = [];
      for (const row of nodesRes.rows || []) { const n = row[0]; if (n && n.id !== undefined) state.people.set(String(n.id), n); }
      for (const row of edgesRes.rows || []) {
        const e = row[0];
        if (!e || e.id === undefined) continue;
        if (!state.people.has(String(e.from)) || !state.people.has(String(e.to))) continue;
        state.links.push({ id: 'e' + e.id, edgeId: String(e.id), from: String(e.from), to: String(e.to), type: e.type || 'RELATED', props: e.props || {} });
      }
      setConn(true, '已连接');
      $('emptyState').style.display = 'none';
      state.loaded = true; state.firstFit = false;
      renderFilters(); renderGraph();
      if (!state.people.size) showEmpty('数据库中还没有历史人物。', '载入示例人物图谱');
    } catch (err) {
      setConn(false, '连接失败');
      showEmpty(err.message, '重新连接');
    } finally {
      $('loading').classList.add('hidden');
    }
  }

  function showEmpty(message, buttonLabel) {

    $('seedBtn').textContent = buttonLabel;
    $('seedBtn').onclick = buttonLabel === '重新连接' ? boot : seed;
    $('emptyHint').innerHTML = '需要先启动 <code>walk serve --addr=:7474</code>';
  }

  function renderFilters() {
    const dynasties = DYNASTY_ORDER.filter((d) => [...state.people.values()].some((p) => p.props && p.props.dynasty === d));
    $('dynastyChips').innerHTML = ['全部', ...dynasties].map((d) => `<button class="chip ${state.dynasty === d ? 'active' : ''}" data-dynasty="${esc(d)}">${esc(d)}</button>`).join('');
    $('dynastyChips').querySelectorAll('.chip').forEach((btn) => { btn.onclick = () => { state.dynasty = btn.dataset.dynasty; renderFilters(); renderGraph(); }; });
    const types = [...new Set(state.links.map((l) => l.type))].sort((a, b) => relLabel(a).localeCompare(relLabel(b), 'zh'));
    const current = state.relType;
    $('relFilter').innerHTML = `<option value="全部">全部关系</option>` + types.map((t) => `<option value="${esc(t)}">${esc(relLabel(t))} (${state.links.filter((l) => l.type === t).length})</option>`).join('');
    $('relFilter').value = types.includes(current) || current === '全部' ? current : '全部';
    state.relType = $('relFilter').value;
    $('relFilter').onchange = (e) => { state.relType = e.target.value; renderGraph(); };
    $('legend').innerHTML = dynasties.map((d) => `<span><i style="background:${dynastyColor(d)}"></i>${esc(d)}</span>`).join('');
    $('counter').innerHTML = `<b>${state.people.size}</b> 人物 · <b>${state.links.length}</b> 关系`;
  }

  function searchMatches() {
    const q = state.query.trim().toLowerCase();
    if (!q) return null;
    const set = new Set();
    for (const [id, p] of state.people) {
      const props = p.props || {};
      const hay = [props.name, props.zi, props.dynasty, props.title, props.bio, p.labels || []].flat().join(' ').toLowerCase();
      if (hay.includes(q)) set.add(id);
    }
    return set;
  }
  function visiblePeople() { return [...state.people.values()].filter((p) => state.dynasty === '全部' || (p.props && p.props.dynasty === state.dynasty)); }
  function neighborSet(id) {
    const set = new Set();
    for (const l of state.links) { if (l.from === id) set.add(l.to); if (l.to === id) set.add(l.from); }
    return set;
  }

  function renderGraph() {
    const visible = new Map(visiblePeople().map((p) => [String(p.id), p]));
    const matches = searchMatches();
    const neighbors = state.selected ? neighborSet(state.selected) : new Set();
    const hasPath = state.pathNodes.size > 0;
    const degrees = new Map();
    for (const l of state.links) { degrees.set(l.from, (degrees.get(l.from) || 0) + 1); degrees.set(l.to, (degrees.get(l.to) || 0) + 1); }
    const nodes = [];
    for (const [id, p] of visible) {
      const props = p.props || {};
      const d = props.dynasty || '其他';
      const dim = (matches && !matches.has(id)) || (hasPath && !state.pathNodes.has(id)) || (state.selected && id !== state.selected && !neighbors.has(id));
      const onPath = state.pathNodes.has(id), selected = state.selected === id;
      const background = onPath ? '#f2cf76' : dim ? '#1a2733' : dynastyColor(d);
      nodes.push({
        id, label: props.name || '人物',
        title: nodeTooltip(props, d),
        shape: 'dot', size: 18 + Math.min(14, (degrees.get(id) || 0) * 2),
        color: { background, border: selected ? '#f8fafc' : onPath ? '#fde68a' : 'rgba(244,213,141,.40)', highlight: { background: '#f2cf76', border: '#fff8e1' }, hover: { background: dim ? '#2a3a49' : dynastyColor(d), border: '#f4d58d' } },
        borderWidth: selected ? 4 : onPath ? 3 : 2,
        font: { color: onPath ? '#151006' : dim ? '#63717d' : '#f7fbf8', size: 13, face: 'Noto Serif SC, Songti SC, SimSun, serif', strokeWidth: 3, strokeColor: '#0a1017', vadjust: 2 },
        shadow: { enabled: true, color: 'rgba(217,180,91,.18)', size: onPath ? 24 : 12, x: 0, y: 0 },
      });
    }
    const links = [];
    for (const l of state.links) {
      if (!visible.has(l.from) || !visible.has(l.to)) continue;
      if (state.relType !== '全部' && l.type !== state.relType) continue;
      const onPath = state.pathEdges.has(l.edgeId);
      const incident = state.selected && (l.from === state.selected || l.to === state.selected);
      const dim = (matches && !(matches.has(l.from) || matches.has(l.to))) || (hasPath && !onPath) || (state.selected && !incident && !onPath);
      links.push({
        id: l.id, from: l.from, to: l.to,
        label: onPath || incident ? relLabel(l.type) : '',
        title: edgeTooltip(l),
        arrows: { to: { enabled: true, scaleFactor: 0.55 } },
        color: { color: onPath ? '#f2cf76' : incident ? relColor(l.type) : dim ? '#1a2a37' : '#2a4356', highlight: '#f4d58d', hover: onPath ? '#fde68a' : relColor(l.type) },
        width: onPath ? 3 : incident ? 2 : 1.1,

        smooth: { enabled: true, type: 'dynamic', roundness: 0.22 },

  function syncNodes(nodes) {
    const next = new Set(nodes.map((n) => n.id));
    const stale = state.nodesDS.getIds().filter((id) => !next.has(String(id)));
    if (stale.length) state.nodesDS.remove(stale);
    if (nodes.length) state.nodesDS.update(nodes);
  }
  function syncEdges(links) {
    const next = new Set(links.map((l) => l.id));
    const stale = state.edgesDS.getIds().filter((id) => !next.has(String(id)));
    if (stale.length) state.edgesDS.remove(stale);
    if (links.length) state.edgesDS.update(links);
  }

  function selectPerson(id, focus = false) {

      const otherId = l.from === state.selected ? l.to : l.from;

  async function findPath(fromId, toId) {
    const from = state.people.get(fromId), to = state.people.get(toId);
    if (!from || !to) return;
    const q = (s) => String(s).replace(/\\/g, '\\\\').replace(/"/g, '\\"');
    const cypher = `MATCH p = shortestPath((a:Person {name: "${q((from.props || {}).name)}"})-[*..8]-(b:Person {name: "${q((to.props || {}).name)}"})) RETURN p`;
    showToast('正在查找关系链…');
    try {
      const res = await api('/query', 'POST', cypher);
      if (!res.rows || !res.rows.length) {
        state.pathInfo = null; state.pathNodes.clear(); state.pathEdges.clear(); state.pathStart = null;
        renderGraph(); renderPathBanner(); showToast('未找到可连通的路径', true); return;
      }
      const path = res.rows[0][0];
      state.pathNodes = new Set((path.nodes || []).map((n) => String(n.id)));
      state.pathEdges = new Set((path.edges || []).map((e) => String(e.id)));
      state.pathInfo = { from: fromId, to: toId, length: path.length ?? (path.edges || []).length };
      state.pathStart = null; state.selected = toId;
      renderGraph(); renderPathBanner(); renderDetail();
      showToast(`找到关系链：${state.pathInfo.length} 度`);
    } catch (err) { showToast(err.message, true); }
  }

  function clearPathMode() {
    state.pathStart = null; state.pathInfo = null; state.pathNodes.clear(); state.pathEdges.clear();
    renderGraph(); renderPathBanner(); renderDetail();
  }

  function renderPathBanner() {
    const el = $('pathBanner');
    if (state.pathStart) {
      const p = state.people.get(state.pathStart);
      el.innerHTML = `<span>起点：<b>${esc((p && p.props || {}).name || '')}</b> · 点击另一个人物查找关系链</span><button id="pathCancel" class="ghost">取消</button>`;
      el.classList.add('show'); $('pathCancel').onclick = clearPathMode; return;
    }
    if (state.pathInfo) {
      const names = [...state.pathNodes].map((id) => ((state.people.get(id) || {}).props || {}).name || '?');
      el.innerHTML = `<span class="chain">关系链：${names.map(esc).join(' → ')} · ${state.pathInfo.length} 度</span><button id="pathClear" class="ghost">清除</button>`;
      el.classList.add('show'); $('pathClear').onclick = clearPathMode; return;
    }
    el.classList.remove('show'); el.innerHTML = '';
  }

  function searchResults() {
    const q = state.query.trim().toLowerCase();
    const box = $('searchResults');
    if (!q) { box.classList.remove('show'); box.innerHTML = ''; return; }
    const found = [...state.people.values()].filter((p) => {
      const props = p.props || {};
      return [props.name, props.zi, props.dynasty, props.title, props.bio, p.labels || []].flat().join(' ').toLowerCase().includes(q);
    }).slice(0, 8);
    box.innerHTML = found.map((p) => {
      const props = p.props || {};
      return `<button class="search-item" data-id="${esc(p.id)}"><b>${esc(props.name || '')}</b><span>${esc(props.dynasty || '')} · ${esc(props.title || '')}</span></button>`;
    }).join('') || `<div class="search-item"><span>没有找到匹配人物</span></div>`;
    box.classList.add('show');
    box.querySelectorAll('.search-item[data-id]').forEach((el) => {
      el.onclick = () => { $('search').value = ''; state.query = ''; box.classList.remove('show'); selectPerson(el.dataset.id, true); renderGraph(); };
    });
  }

  async function seed() {
    const btn = $('seedBtn'); btn.disabled = true; btn.textContent = '正在载入…';
    try { await api('/update', 'POST', SEED); showToast('示例人物图谱已载入'); state.selected = null; await load(); }
    catch (err) { showToast(err.message, true); btn.disabled = false; btn.textContent = '载入示例人物图谱'; }
  }
  function randomPerson() {
    const people = visiblePeople();
    if (!people.length) return showToast('当前筛选下没有人物', true);
    selectPerson(String(people[Math.floor(Math.random() * people.length)].id), true);
  }

  function bindUI() {
    $('seedBtn').onclick = seed;
    $('randomBtn').onclick = randomPerson;
    $('fitBtn').onclick = () => state.network && state.network.fit({ animation: { duration: 500 } });
    $('reloadBtn').onclick = load;
    $('search').addEventListener('input', (e) => { state.query = e.target.value; renderGraph(); searchResults(); });
    $('search').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { const first = $('searchResults').querySelector('[data-id]'); if (first) first.click(); }
      else if (e.key === 'Escape') { $('search').value = ''; state.query = ''; $('searchResults').classList.remove('show'); renderGraph(); }
    });
    document.addEventListener('click', (e) => { if (!e.target.closest('.search-wrap')) $('searchResults').classList.remove('show'); });
  }

  async function boot() {
    bindUI(); initNetwork();
    try {
      const stats = await api('/stats');
      setConn(true, '已连接');
      if (!stats.nodes || stats.nodes === 0) {
        showEmpty('数据库为空，载入一份示例历史人物图谱开始探索。', '载入示例人物图谱');
        $('loading').classList.add('hidden'); $('counter').innerHTML = `<b>0</b> 人物 · <b>0</b> 关系`;
        return;
      }
      await load();
    } catch (err) {
      setConn(false, '连接失败'); showEmpty(err.message, '重新连接'); $('loading').classList.add('hidden');
    }
  }

  boot();
})();
</script>
</body>
</html>
